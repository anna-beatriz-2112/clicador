<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site em Python</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .counter-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .counter-label {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .counter-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #38bdf8;
            transition: transform 0.1s ease;
        }

        .btn {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <span class="dot"></span>
            Servidor Python Ativo
        </div>
        <h1>Olá, Mundo! 🐍</h1>
        <p>Este site está rodando localmente no seu computador através de um servidor em Python.</p>
        
        <div class="counter-box">
            <div class="counter-label">Contador Persistente</div>
            <div id="counter" class="counter-value">...</div>
        </div>

        <button class="btn" id="clickBtn" onclick="increment()">Clique aqui!</button>

        <footer>
            Salvo diretamente no servidor em <code>counter.json</code>
        </footer>
    </div>

    <script>
        const counterEl = document.getElementById('counter');
        const btn = document.getElementById('clickBtn');

        async function fetchCount() {
            try {
                const res = await fetch('/api/count');
                const data = await res.json();
                counterEl.innerText = data.count;
            } catch (err) {
                console.error('Erro ao buscar contador:', err);
                counterEl.innerText = '0';
            }
        }

        async function increment() {
            btn.disabled = true;
            try {
                const res = await fetch('/api/increment', { method: 'POST' });
                const data = await res.json();
                counterEl.innerText = data.count;
                // Efeito sutil de animação
                counterEl.style.transform = 'scale(1.15)';
                setTimeout(() => counterEl.style.transform = 'scale(1)', 150);
            } catch (err) {
                console.error('Erro ao incrementar:', err);
            } finally {
                btn.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', fetchCount);
    </script>
</body>
</html>
